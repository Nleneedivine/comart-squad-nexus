name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package.json and package-lock.json are currently out of sync in the
      # upstream Lovable export. Use npm install for validation until the lock
      # file is regenerated from the canonical package.json.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci-project
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          VITE_SENTRY_DSN: ""

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      - run: supabase test db
