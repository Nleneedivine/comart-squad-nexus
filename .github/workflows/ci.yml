name: CI

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint

  security-static:
    name: Security migration/static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no committed environment file
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked"
            exit 1
          fi

      - name: Verify migration exists
        shell: bash
        run: test -f supabase/migrations/20261008020000_harden_store_integrations_settings.sql

      - name: Verify sensitive integration settings are server-only
        shell: bash
        run: |
          grep -q 'REVOKE ALL PRIVILEGES' supabase/migrations/20261008020000_harden_store_integrations_settings.sql
          grep -q 'store_integrations.settings' supabase/migrations/20261008020000_harden_store_integrations_settings.sql

      - name: Verify security regression suite exists
        shell: bash
        run: test -f supabase/tests/security_regression.sql
