name: Format hardening branch

on:
  push:
    branches:
      - hardening/phase-0-to-3

permissions:
  contents: write

concurrency:
  group: hardening-maintenance
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and regenerate lockfile
        run: npm install --no-audit --no-fund

      - name: Format TypeScript
        run: npx prettier --write "**/*.{ts,tsx}"

      - name: Commit formatting and lockfile
        run: |
          if git diff --quiet; then
            echo "No formatting or lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts' '*.tsx' package-lock.json
          git commit -m "chore: format sources and sync npm lockfile"
          git push
